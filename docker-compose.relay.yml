version: '3.8'

services:
  csn-stream-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    container_name: csn_live_camera_relay
    restart: always
    network_mode: host
    environment:
      - RTSP_URL=${RTSP_URL:-rtsp://admin:Qwerty%4012345@192.168.1.150:554/cam/realmonitor?channel=1&subtype=0}
      - YOUTUBE_STREAM_KEY=${YOUTUBE_STREAM_KEY}
      - YOUTUBE_RTMP_SERVER=${YOUTUBE_RTMP_SERVER:-rtmp://a.rtmp.youtube.com/live2}
      - RTSP_TRANSPORT=tcp
      - INITIAL_BACKOFF_SEC=3
      - MAX_BACKOFF_SEC=60
      - TCP_PROBE_TIMEOUT_SEC=3
    env_file:
      - .env.stream
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
